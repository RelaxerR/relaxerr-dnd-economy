services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: src/DndEconomy.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
      MacroApi__PlayerKey: ${MACRO_API_PLAYER_KEY}
      MacroApi__AdminKey: ${MACRO_API_ADMIN_KEY}
      Chat__StoragePath: /data/chat-files
      WebPush__Subject: ${WEB_PUSH_SUBJECT:-}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY:-}
      MusicReview__SourcePath: /music/source
      MusicReview__DestinationPath: /music/clean
    volumes:
      - chatfiles:/data/chat-files
      - ${MUSIC_SOURCE_PATH:?Set MUSIC_SOURCE_PATH}:/music/source
      - ${MUSIC_DESTINATION_PATH:?Set MUSIC_DESTINATION_PATH}:/music/clean
    ports:
      - "127.0.0.1:5041:8080"
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  chatfiles:
